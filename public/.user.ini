; Limites d'upload relevées pour les photos de compagnie (carrousel connexion/site) et les
; logos : les 2M/8M par défaut du php.ini système suffisent à peine pour une seule photo de
; téléphone, et pas du tout pour plusieurs à la fois (add row, jusqu'à 12 photos). Fichier
; local au projet — ne touche pas la config PHP globale de la machine.
upload_max_filesize = 8M
post_max_size = 60M
max_file_uploads = 20
